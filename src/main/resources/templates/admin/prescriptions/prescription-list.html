<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">

<head>
    <title>Phê Duyệt Đơn Thuốc — SmartHealth Admin</title>
    <style>
        .page-sub { font-size: .9rem; color: #64748b; margin-bottom: 32px; }

        .alert-success {
            background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 10px;
            padding: .85rem 1.1rem; color: #065f46; font-size: .88rem; font-weight: 500;
            display: flex; align-items: center; gap: .6rem; margin-bottom: 1.5rem;
        }
        .alert-danger {
            background: #fef2f2; border: 1px solid #fca5a5; border-radius: 10px;
            padding: .85rem 1.1rem; color: #991b1b; font-size: .88rem; font-weight: 500;
            display: flex; align-items: center; gap: .6rem; margin-bottom: 1.5rem;
        }

        .page-card {
            background: #fff; border-radius: 16px; padding: 32px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 1.5rem;
        }

        .rx-header {
            display: flex; align-items: flex-start;
            justify-content: space-between; margin-bottom: 1.25rem;
            padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0;
        }
        .rx-header h5 { font-size: 1rem; font-weight: 600; margin-bottom: .2rem; }
        .rx-header p { font-size: .82rem; color: #64748b; margin: 0; }

        .badge-pending   { background: #fef3c7; color: #92400e; padding: .3rem .75rem; border-radius: 20px; font-size: .75rem; font-weight: 700; }
        .badge-dispensed { background: #d1fae5; color: #065f46; padding: .3rem .75rem; border-radius: 20px; font-size: .75rem; font-weight: 700; }

        .med-table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; }
        .med-table th {
            font-size: .78rem; font-weight: 700; color: #64748b;
            text-align: left; padding: .5rem .75rem;
            border-bottom: 1.5px solid #e2e8f0;
        }
        .med-table td {
            font-size: .85rem; padding: .65rem .75rem;
            border-bottom: 1px solid #e2e8f0; color: #1e293b;
        }
        .med-table tr:last-child td { border-bottom: none; }

        .stock-ok   { color: #059669; font-weight: 600; }
        .stock-low  { color: #d97706; font-weight: 600; }
        .stock-none { color: #dc2626; font-weight: 600; }

        .btn-dispense {
            background: #4f46e5; color: #fff; border: none; border-radius: 8px;
            padding: .55rem 1.25rem; font-family: inherit; font-size: .88rem;
            font-weight: 600; cursor: pointer; transition: background .15s;
            display: inline-flex; align-items: center; gap: .4rem;
        }
        .btn-dispense:hover { background: #4338ca; }

        .instructions-note {
            background: #f8fafc; border-radius: 8px; padding: .75rem 1rem;
            font-size: .82rem; color: #64748b; margin-bottom: 1rem;
            border-left: 3px solid #4f46e5;
        }

        .empty { text-align: center; color: #64748b; padding: 3rem 0; font-size: .9rem; }
    </style>
</head>

<body>
<div layout:fragment="content">

    <div class="d-flex align-items-center justify-content-between mb-2">
        <div>
            <h1 class="page-title mb-1"
                style="font-size: 1.75rem; font-weight: 700; color: #0f172a; letter-spacing: -0.02em;">
                Phê Duyệt Đơn Thuốc
            </h1>
            <p class="page-sub">Danh sách đơn thuốc chờ cấp phát</p>
        </div>
    </div>

    <div class="alert-success" th:if="${param.success}">
        <i class="fa-solid fa-circle-check"></i>
        Cấp phát thuốc thành công. Tồn kho đã được cập nhật.
    </div>
    <div class="alert-danger" th:if="${param.error}">
        <i class="fa-solid fa-circle-xmark"></i>
        <span th:text="${errorMessage} ?: 'Không đủ tồn kho để cấp phát đơn thuốc này.'"></span>
    </div>

    <div th:if="${!prescriptions.isEmpty()}">
        <div class="page-card" th:each="p : ${prescriptions}">

            <div class="rx-header">
                <div>
                    <h5 th:text="${p.appointment.patient.fullName}">Tên bệnh nhân</h5>
                    <p>
                        BS. <span th:text="${p.appointment.doctor.user.fullName}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${#temporals.format(p.appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${#temporals.format(p.appointment.startTime, 'HH:mm')}"></span>
                    </p>
                </div>
                <span class="badge-pending"  th:if="${p.status.name() == 'PENDING'}">Chờ cấp phát</span>
                <span class="badge-dispensed" th:if="${p.status.name() == 'DISPENSED'}">Đã phát</span>
            </div>

            <div class="instructions-note" th:if="${p.instructions != null and !p.instructions.isBlank()}">
                <strong>Hướng dẫn:</strong> <span th:text="${p.instructions}"></span>
            </div>

            <table class="med-table">
                <thead>
                <tr>
                    <th>Tên thuốc</th>
                    <th>Đơn vị</th>
                    <th>Số lượng kê</th>
                    <th>Tồn kho hiện tại</th>
                    <th>Liều dùng</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detail : ${p.details}">
                    <td th:text="${detail.medicine.name}"></td>
                    <td th:text="${detail.medicine.unit}"></td>
                    <td th:text="${detail.quantity}"></td>
                    <td>
                            <span th:if="${detail.medicine.stockQuantity >= detail.quantity}"
                                  class="stock-ok"
                                  th:text="${detail.medicine.stockQuantity}"></span>
                        <span th:if="${detail.medicine.stockQuantity > 0 and detail.medicine.stockQuantity < detail.quantity}"
                              class="stock-low"
                              th:text="${detail.medicine.stockQuantity} + ' (không đủ)'"></span>
                        <span th:if="${detail.medicine.stockQuantity == 0}"
                              class="stock-none">Hết hàng</span>
                    </td>
                    <td th:text="${detail.dosage}"></td>
                </tr>
                </tbody>
            </table>

            <form th:action="@{/admin/prescriptions/dispense}" method="post">
                <input type="hidden" name="prescriptionId" th:value="${p.id}"/>
                <button type="submit" class="btn-dispense">
                    <i class="fa-solid fa-box-open"></i> Xác nhận cấp phát
                </button>
            </form>

        </div>
    </div>

    <div class="empty" th:if="${prescriptions.isEmpty()}">
        <i class="fa-solid fa-box-open" style="font-size:2rem; margin-bottom:.75rem; display:block"></i>
        Không có đơn thuốc nào đang chờ cấp phát.
    </div>

</div>
</body>
</html>

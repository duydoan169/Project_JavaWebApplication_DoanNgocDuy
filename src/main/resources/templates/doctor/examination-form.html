<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Khám Bệnh — SmartHealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --primary-light: #eef2ff; --primary-mid: #c7d2fe;
            --text: #1e1b4b; --muted: #6b7280; --border: #e5e7eb;
            --bg: #f5f5f9; --white: #ffffff; --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        .topbar {
            background: var(--white); border-bottom: 1px solid var(--border);
            padding: 0 2rem; height: 60px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .topbar-brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.15rem; color: var(--primary); }
        .btn-ghost {
            background: none; border: none; padding: .45rem .85rem; border-radius: 8px;
            font-family: inherit; font-size: .88rem; font-weight: 500; color: var(--muted);
            cursor: pointer; display: flex; align-items: center; gap: .4rem; transition: background .15s, color .15s;
        }
        .btn-ghost:hover { background: var(--bg); color: var(--text); }

        .main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

        .patient-card {
            background: var(--white); border: 1.5px solid var(--border); border-radius: 12px;
            padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 1.25rem;
        }
        .patient-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--primary-light); color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
        }
        .patient-info h4 { font-size: .95rem; font-weight: 600; margin-bottom: .2rem; }
        .patient-info p { font-size: .82rem; color: var(--muted); }

        .section-card {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem;
        }
        .section-card h3 {
            font-size: .88rem; font-weight: 700; color: var(--text);
            margin-bottom: 1.1rem; display: flex; align-items: center; gap: .5rem;
        }
        .section-card h3 i { color: var(--primary); }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .82rem; font-weight: 600; color: var(--text); margin-bottom: .35rem; }
        .form-control {
            width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
            padding: .6rem .9rem; font-family: inherit; font-size: .9rem; color: var(--text);
            transition: border-color .2s; resize: vertical;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        .text-danger { color: var(--danger); font-size: .8rem; margin-top: .3rem; display: block; }

        /* Medicine table */
        .medicine-table { width: 100%; border-collapse: collapse; }
        .medicine-table th {
            font-size: .78rem; font-weight: 700; color: var(--muted);
            text-align: left; padding: .5rem .6rem;
            border-bottom: 1.5px solid var(--border);
        }
        .medicine-table td { padding: .5rem .4rem; vertical-align: top; }
        .medicine-table tr:not(:last-child) td { border-bottom: 1px solid var(--border); }

        .medicine-table select.form-control,
        .medicine-table input.form-control { padding: .5rem .7rem; font-size: .85rem; }

        .row-num {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--primary-light); color: var(--primary);
            font-size: .72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin-top: .4rem;
        }

        .medicine-hint {
            font-size: .78rem; color: var(--muted); margin-top: .75rem;
            display: flex; align-items: center; gap: .4rem;
        }

        .submit-bar {
            display: flex; justify-content: flex-end; gap: .75rem;
            padding-top: 1.25rem; border-top: 1.5px solid var(--border); margin-top: 1.25rem;
        }
        .btn-submit {
            background: var(--primary); color: #fff; border: none; border-radius: 8px;
            padding: .7rem 1.75rem; font-family: inherit; font-size: .95rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: .5rem; transition: background .15s;
        }
        .btn-submit:hover { background: var(--primary-dark); }
        .btn-back {
            background: none; border: 1.5px solid var(--border); border-radius: 8px;
            padding: .7rem 1.25rem; font-family: inherit; font-size: .95rem; font-weight: 500;
            color: var(--muted); cursor: pointer; transition: border-color .15s, color .15s;
        }
        .btn-back:hover { border-color: var(--text); color: var(--text); }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-brand" th:href="@{/doctor/home}"><i class="fa-solid fa-heart-pulse"></i> SmartHealth</div>
    <a href="/doctor/examination/list"><button class="btn-ghost"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</button></a>
</div>

<div class="main">

    <!-- Patient info -->
    <div class="patient-card">
        <div class="patient-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="patient-info">
            <h4 th:text="${appointment.patient.fullName}">Tên bệnh nhân</h4>
            <p>
                <span th:text="${appointment.patient.phone} ?: 'Chưa có SĐT'"></span>
                &nbsp;·&nbsp;
                <i class="fa-regular fa-clock"></i>
                <span th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></span>
                —
                <span th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></span>
            </p>
            <p th:if="${appointment.reason != null and !appointment.reason.isBlank()}"
               th:text="'Lý do: ' + ${appointment.reason}"
               style="font-style: italic"></p>
        </div>
    </div>

    <form th:action="@{/doctor/examination/submit}" th:object="${examinationDTO}" method="post">
        <input type="hidden" th:field="*{appointmentId}"/>

        <!-- Diagnosis section -->
        <div class="section-card">
            <h3><i class="fa-solid fa-stethoscope"></i> Kết quả chẩn đoán</h3>

            <div class="form-group">
                <label>Triệu chứng <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" th:field="*{symptoms}" rows="3"
                          placeholder="Mô tả triệu chứng của bệnh nhân..."></textarea>
                <span th:if="${#fields.hasErrors('symptoms')}"
                      th:text="${#fields.errors('symptoms')[0]}" class="text-danger"></span>
            </div>

            <div class="form-group">
                <label>Chẩn đoán <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" th:field="*{diagnosis}" rows="3"
                          placeholder="Kết quả chẩn đoán..."></textarea>
                <span th:if="${#fields.hasErrors('diagnosis')}"
                      th:text="${#fields.errors('diagnosis')[0]}" class="text-danger"></span>
            </div>

            <div class="form-group">
                <label>Ghi chú <span style="color:var(--muted); font-weight:400">(tùy chọn)</span></label>
                <textarea class="form-control" th:field="*{notes}" rows="2"
                          placeholder="Ghi chú thêm nếu có..."></textarea>
            </div>
        </div>

        <!-- Prescription section -->
        <div class="section-card">
            <h3><i class="fa-solid fa-prescription-bottle-medical"></i> Đơn thuốc</h3>

            <div class="form-group">
                <label>Hướng dẫn dùng thuốc chung <span style="color:var(--muted); font-weight:400">(tùy chọn)</span></label>
                <textarea class="form-control" th:field="*{instructions}" rows="2"
                          placeholder="VD: Uống sau bữa ăn, không dùng với rượu bia..."></textarea>
            </div>

            <!-- Fixed 5 medicine rows -->
            <table class="medicine-table">
                <thead>
                <tr>
                    <th style="width:28px"></th>
                    <th style="width:40%">Tên thuốc</th>
                    <th style="width:15%">Số lượng</th>
                    <th>Liều dùng</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m, i : *{medicines}">
                    <td>
                        <div class="row-num" th:text="${i.index + 1}">1</div>
                    </td>
                    <td>
                        <select class="form-control"
                                th:field="*{medicines[__${i.index}__].medicineId}">
                            <option value="">-- Để trống --</option>
                            <option th:each="med : ${medicines}"
                                    th:value="${med.id}"
                                    th:text="${med.name + ' (' + med.unit + ')'}">
                            </option>
                        </select>
                    </td>
                    <td>
                        <input type="number" class="form-control" min="1"
                               th:field="*{medicines[__${i.index}__].quantity}"
                               placeholder="0"/>
                    </td>
                    <td>
                        <input type="text" class="form-control"
                               th:field="*{medicines[__${i.index}__].dosage}"
                               placeholder="VD: 1 viên/lần, 2 lần/ngày"/>
                    </td>
                </tr>
                </tbody>
            </table>

            <p class="medicine-hint">
                <i class="fa-solid fa-circle-info"></i>
                Để trống các hàng không dùng đến. Hàng nào có chọn thuốc thì bắt buộc điền đủ số lượng và liều dùng.
            </p>

            <span th:if="${#fields.hasErrors('medicines')}"
                  th:text="${#fields.errors('medicines')[0]}" class="text-danger"
                  style="margin-top:.5rem; display:block"></span>
        </div>

        <div class="submit-bar">
            <a href="/doctor/examination/list">
                <button type="button" class="btn-back">Hủy</button>
            </a>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-floppy-disk"></i> Lưu hồ sơ khám
            </button>
        </div>
    </form>
</div>
</body>
</html>
